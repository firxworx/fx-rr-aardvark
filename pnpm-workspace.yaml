packages:
  - packages/*
  - apps/*
  - tooling/*
  - "!**/docs/**"
  - "!**/scripts/**"

allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
  workerd: true

onlyBuiltDependencies:
  - esbuild
  - lefthook
  - sharp
  - workerd

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - pnpm

catalog:
  # react
  react: "^19.3.1"
  react-dom: "^19.3.1"
  "@types/react": "^19.3.0"
  "@types/react-dom": "^19.3.0"

  # framework
  react-router: "^8.5.2"
  "@react-router/dev": "^8.5.2"
  "@react-router/fs-routes": "^8.5.2"
  isbot: "^5.2.3"
  nuqs: "^2.10.3"

  # schema
  zod: "^4.6.7"

  # cloudflare
  wrangler: "^4.166.0"
  "@cloudflare/vite-plugin": "1.70.1"

  # images (og script)
  "@napi-rs/canvas": "^1.2.0"
  "@napi-rs/image": "^1.16.0"

  # build / ts / testing
  "@biomejs/biome": "2.6.8"
  "@playwright/test": "^1.65.1"
  "@testing-library/dom": "^10.4.2"
  "@testing-library/jest-dom": "^8.0.0"
  "@testing-library/react": "^16.3.3"
  "@vitejs/plugin-react": "^6.3.0"
  jsdom: "^31.0.1"
  syncpack: "^15.3.4"
  typescript: "^7.0.2"
  vite: "^8.3.8"
  vite-node: "^6.0.0"
  vitest: "^5.1.1"
  "@types/node": "^26.6.6"

  # tailwind
  tailwindcss: "^4.3.5"
  tailwind-merge: "^3.7.1"
  tw-animate-css: "^1.3.4"
  "@tailwindcss/vite": "^4.3.5"
  "@tailwindcss/postcss": "^4.3.5"

  # ui components
  "@base-ui/react": "1.9.0"
  "@fontsource-variable/inter": "^5.3.0"
  class-variance-authority: "^0.7.1"
  clsx: "^2.1.1"
  fontaine: "^1.0.3"
  lucide-react: "^1.77.0"
  shadcn: "^4.23.0"

  # scripts / tooling
  "@clack/prompts": "^1.9.0"

  # utilities
  date-fns: "^4.4.0"
