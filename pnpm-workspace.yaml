packages:
  - packages/*
  - apps/*
  - tooling/*
  - "!**/docs/**"
  - "!**/scripts/**"

allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
  workerd: true

onlyBuiltDependencies:
  - esbuild
  - lefthook
  - sharp
  - workerd

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - pnpm

catalog:
  # react
  react: "^19.2.8"
  react-dom: "^19.2.8"
  "@types/react": "^19.2.18"
  "@types/react-dom": "^19.2.5"

  # framework
  react-router: "^8.3.0"
  "@react-router/dev": "^8.3.0"
  "@react-router/fs-routes": "^8.3.0"
  isbot: "^5.2.2"
  nuqs: "^2.10.1"

  # schema
  zod: "^4.4.3"

  # cloudflare
  wrangler: "^4.127.0"
  "@cloudflare/vite-plugin": "1.54.1"

  # images (og script)
  "@napi-rs/canvas": "^1.0.8"
  "@napi-rs/image": "^1.14.0"

  # build / ts / testing
  "@biomejs/biome": "2.5.11"
  "@playwright/test": "^1.62.1"
  "@testing-library/dom": "^10.4.1"
  "@testing-library/jest-dom": "^7.0.1"
  "@testing-library/react": "^16.3.3"
  "@vitejs/plugin-react": "^6.1.0"
  jsdom: "^30.0.1"
  syncpack: "^15.3.3"
  typescript: "^7.0.2"
  vite: "^8.2.2"
  vite-node: "^6.0.0"
  vitest: "^4.1.11"
  "@types/node": "^26.4.0"

  # tailwind
  tailwindcss: "^4.3.3"
  tailwind-merge: "^3.6.0"
  tw-animate-css: "^1.3.4"
  "@tailwindcss/vite": "^4.3.3"
  "@tailwindcss/postcss": "^4.3.3"

  # ui components
  "@base-ui/react": "1.7.0"
  "@fontsource-variable/inter": "^5.3.0"
  class-variance-authority: "^0.7.1"
  clsx: "^2.1.1"
  fontaine: "^0.8.1"
  lucide-react: "^1.34.0"

  # scripts / tooling
  "@clack/prompts": "^1.7.0"

  # utilities
  change-case: "^5.4.4"
  date-fns: "^4.4.0"
